version: '3.8'

services:
  api-upstream:
    image: node:20-alpine
    container_name: saas_api_backend
    restart: always # Tells AlmaLinux to boot this container if Docker starts
    working_dir: /app
    volumes:
      - ../:/app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @saas/api build && pnpm --filter @saas/api start"
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"

  reverse-proxy:
    image: nginx:alpine
    container_name: saas_edge_router
    restart: always # Ensures the web traffic router automatically recovers on reboot
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../apps/web/dist:/usr/share/nginx/html/web:ro
      - ../apps/docs/.vitepress/dist:/usr/share/nginx/html/docs:ro
      - ./logs:/app/infra/logs # Canlı log klasör köprüsü
    depends_on:
      - api-upstream
