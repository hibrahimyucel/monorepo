version: '3.8'

services:
  api-upstream:
    image: node:20-alpine
    container_name: saas_api_backend
    
       # ... mevcut port ve env ayarlarınız
    working_dir: /app/apps/api
    # pnpm start yerine doğrudan node ile başlatarak paket yöneticisi yükünü kaldırıyoruz
    command: node dist/index.js 
    
    restart: always # Tells AlmaLinux to boot this container if Docker starts
    
    volumes:
      - ../:/app
    deploy:
      resources:
        limits:
          cpus: '0.25'      # Geliştirici işlemcisini yormaması için limit
          memory: 128M     # Express backend için 128MB fazlasıyla yeterli
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"

  reverse-proxy:
    image: nginx:alpine
    container_name: saas_edge_router
    restart: always # Ensures the web traffic router automatically recovers on reboot
    ports:
      - "80:80"
    volumes:
            # CRITICAL: Maps your compiled React build files directly into the Nginx container target route
      - ../apps/web/dist:/usr/share/nginx/html
      # Maps your VitePress production build documentation into the alias target route
      - ../apps/docs/.vitepress/dist:/usr/share/nginx/html/docs
      # Mounts the configurations
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/app/infra/logs # Canlı log klasör köprüsü
      
      # Mounts the configurations
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'      # Geliştirici işlemcisini yormaması için limit
          memory: 128M     # Express backend için 128MB fazlasıyla yeterli
    depends_on:
      - api-upstream
