version: '3.8'

services:
  # Upstream API Execution Sandbox
  api-upstream:
    image: node:20-alpine
    container_name: saas_api_backend
    working_dir: /app
    volumes:
      - ../:/app
    command: sh -c "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @saas/api build && pnpm --filter @saas/api start"
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"

  # Frontline Reverse Proxy Engine (Serves static builds & handles API mapping)
  reverse-proxy:
    image: nginx:alpine
    container_name: saas_edge_router
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../apps/web/dist:/usr/share/nginx/html/web:ro
      - ../apps/docs/.vitepress/dist:/usr/share/nginx/html/docs:ro
    depends_on:
      - api-upstream
