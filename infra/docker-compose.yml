version: '3.8'

services:
  api-upstream:
    image: node:20-alpine
    container_name: saas_api_backend
    
       # ... mevcut port ve env ayarlarınız
    working_dir: /app/apps/api
    # pnpm start yerine doğrudan node ile başlatarak paket yöneticisi yükünü kaldırıyoruz
    command: node dist/index.js 
    
    restart: always # Tells AlmaLinux to boot this container if Docker starts
    
    volumes:
      - ../:/app
    
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"

  reverse-proxy:
    image: nginx:alpine
    container_name: saas_edge_router
    restart: always # Ensures the web traffic router automatically recovers on reboot
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../apps/web/dist:/usr/share/nginx/html/web:ro
      - ../apps/docs/.vitepress/dist:/usr/share/nginx/html/docs:ro
      - ./logs:/app/infra/logs # Canlı log klasör köprüsü
    depends_on:
      - api-upstream
