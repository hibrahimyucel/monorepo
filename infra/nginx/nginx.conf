events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name localhost;

        # 1. Main Dashboard UI Deployment routing
        location / {
            root /usr/share/nginx/html/web;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. VitePress Academic Documentation Site routing
        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            index index.html;
            try_files $uri $uri/ /docs/index.html;
        }

        # 3. Microservice API Backend Gateway Proxy routing (With Telemetry Passing)
        location /api/ {
    # Sondaki eğik çizgi (/) istekleri /api/telemetry -> /telemetry olarak temizleyerek aktarır
    proxy_pass http://saas_api_backend:5000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
}

    }
}
