user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log emerg; # Sadece kritik hataları bas
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # GÜVENLİ BÖLGE: Hız sınırı bölgesi sadece ve sadece burada tanımlanır!
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # 1. Vite React Frontend & History API Desteği
        location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html; # Enables client-side React Router navigation fluidly
}

location /docs/ {
    alias /usr/share/nginx/html/docs/;
    try_files $uri $uri/ /docs/index.html;
}

        # 3. Telemetry Express API Mikroservis Geçidi (Proxied)
        location /api/ {
            # Hız sınırını burada aktif ediyoruz (Zone tanımı yukarından miras alınır)
            limit_req zone=api_limit_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://saas_api_backend:5000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

