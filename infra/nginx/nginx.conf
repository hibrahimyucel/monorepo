# infra/nginx/nginx.conf
# En tepedeki 'user nginx;' satırını Alpine imajının kendi yetkisine bırakmak için sildik!

worker_processes auto;
error_log /var/log/nginx/error.log warn; # Hataları izleyebilmek için 'warn' seviyesine çektik
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hız sınırı bölgesi tanımı
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # 1. Vite React Frontend & History API Fallback Köprüsü
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. VitePress Akademik Dokümantasyon Modülü
        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            try_files $uri $uri/ /docs/index.html;
        }

        # 3. Telemetry Express API Rotaları (Hız Sınırı Aktif)
        location /api/telemetry/snapshot {
            limit_req zone=api_limit_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://saas_api_backend:5000/telemetry/snapshot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Canlı Akış Hattı (SSE - Kesintisiz Akış, Sınırsız Geçiş)
        location /api/telemetry/stream {
            proxy_pass http://saas_api_backend:5000/telemetry/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # SSE Canlı Akış Ayarları
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
        }
    }
}

