name: Deploy VitePress site to Pages

on:
  push:
    branches: [main] # veya master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 1. Bağımlılıkları Kur (apps/docs ve onun yerel bağımlılıkları olan packages/ui vb.)
      - name: Install dependencies
        run: pnpm install --filter ./apps/docs... --no-frozen-lockfile

      # 2. Sadece VitePress dokümantasyonunu derle
      - name: Build with VitePress
        run: pnpm --filter ./apps/docs run build

      # 3. Gerçek çıktı klasörünü GitHub Pages'e yükle
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist # 🟢 Tam klasör yolu güncellendi


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

