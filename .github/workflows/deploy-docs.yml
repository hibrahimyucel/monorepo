name: Deploy VitePress site to Pages

on:
  push:
    branches: [main] # veya master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 🟢 KRİTİK ADIM 1: Sadece dokümantasyon projesini ve onun bağımlılıklarını kur
      - name: Install dependencies
        run: pnpm install --filter docs... --no-frozen-lockfile

      # 🟢 KRİTİK ADIM 2: Sadece dokümantasyon projesini derle
      - name: Build with VitePress
        run: pnpm --filter docs run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Derlenen statik dosyaların çıktığı yer (genelde .vitepress/dist olur)
          path: docs/.vitepress/dist 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

